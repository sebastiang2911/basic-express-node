<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="REST API built with Node.js, Express, and TypeScript." />
    <title>REST Server | Node.js + TypeScript</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #09111f; color: #e5edf8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 20px; background: radial-gradient(circle at 15% 15%, #183765 0, transparent 32%), radial-gradient(circle at 85% 80%, #153f35 0, transparent 30%), #09111f; }
      main { width: min(860px, 100%); }
      .eyebrow { color: #63e6be; font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 10px 0 14px; font-size: clamp(2.4rem, 8vw, 5rem); line-height: .98; }
      .lead { max-width: 650px; color: #aebdd1; font-size: 1.08rem; line-height: 1.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 34px; }
      article { padding: 20px; border: 1px solid #263852; border-radius: 16px; background: rgb(13 27 46 / 78%); box-shadow: 0 16px 50px rgb(0 0 0 / 20%); }
      h2 { margin: 0 0 12px; font-size: 1rem; }
      p { margin: 0; }
      code { color: #7ee7c5; font-family: "SFMono-Regular", Consolas, monospace; }
      .methods { display: flex; flex-wrap: wrap; gap: 8px; }
      .methods span { padding: 5px 8px; border-radius: 6px; background: #172b47; color: #c6d5e8; font: 700 .72rem "SFMono-Regular", Consolas, monospace; }
      a { color: #7ee7c5; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Server online</p>
      <h1>REST Server</h1>
      <p class="lead">Educational REST API built with Node.js, Express, and TypeScript. It separates the server, routes, and controllers to keep each responsibility clear.</p>
      <section class="grid" aria-label="Project information">
        <article><h2>Main endpoint</h2><p><a href="/api/users"><code>/api/users</code></a></p></article>
        <article><h2>Available methods</h2><div class="methods" aria-label="HTTP methods"><span>GET</span><span>POST</span><span>PUT</span><span>PATCH</span><span>DELETE</span></div></article>
        <article><h2>Request flow</h2><p><code>index → Server → routes → controllers</code></p></article>
      </section>
    </main>
  </body>
</html>
