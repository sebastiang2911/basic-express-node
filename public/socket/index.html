<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Socket.IO client" />
    <title>Socket.IO | REST Server</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/socket/styles.css" />
  </head>
  <body>
    <main class="home">
      <header>
        <p class="eyebrow">Real-time communication</p>
        <h1>Socket.IO</h1>
        <p class="lead">
          A simple Socket.IO client for real-time messaging.
        </p>
        <a href="/">← Back to home</a>
      </header>

      <section id="socket-app" class="chat" aria-label="Socket.IO chat">
        <div class="chat-header">
          <strong>Chat</strong>
          <span id="socket-status">Connecting…</span>
        </div>
        <div id="messages" class="messages" aria-live="polite">
          <p class="empty-message">Send a message to get started.</p>
        </div>
        <form id="message-form">
          <label class="sr-only" for="message-input">Message</label>
          <input
            id="message-input"
            name="message"
            type="text"
            placeholder="Type a message"
            autocomplete="off"
            required
          />
          <button id="message-submit" type="submit" disabled>Send</button>
        </form>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/socket/app.js"></script>
  </body>
</html>
