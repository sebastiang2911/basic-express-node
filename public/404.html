<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Page not found</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #e5edf8; background: #09111f; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
      main { max-width: 560px; }
      strong { display: block; color: #63e6be; font-size: clamp(5rem, 20vw, 10rem); line-height: 1; }
      h1 { margin: 18px 0 10px; }
      p { color: #aebdd1; line-height: 1.6; }
      a { display: inline-block; margin-top: 18px; padding: 11px 16px; border-radius: 9px; background: #63e6be; color: #07120f; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body><main><strong>404</strong><h1>Page not found</h1><p>The requested address does not exist on this server.</p><a href="/">Back to home</a></main></body>
</html>
