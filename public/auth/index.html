<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JWT authentication"><title>REST Server | Auth</title><link rel="stylesheet" href="./styles.css"></head><body><main class="auth-page"><a class="back" href="/">← Volver</a><section class="auth-card"><p class="eyebrow">JWT Authentication</p><h1>Bienvenido</h1><p class="lead">Ingresa tus credenciales para continuar.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Iniciar sesión</button></form><div id="session" class="session" hidden><p>Sesión iniciada como</p><strong id="user-name"></strong><button id="signout" class="secondary" type="button">Cerrar sesión</button></div><p id="message" class="message" role="status"></p><a class="google-link" href="/auth-google/">Continuar con Google →</a></section></main><script src="./app.js"></script></body></html>
